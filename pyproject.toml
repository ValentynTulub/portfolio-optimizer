[project]
name = "portfolio-optimizer"
version = "0.1.0"
description = "Sortino-focused portfolio weight optimizer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
